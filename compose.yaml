name: lm-benchlab
services:
  lab:
    build: .
    image: lm-benchlab:local
    labels:
      org.opencontainers.image.title: LM Benchlab
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${LM_BENCHLAB_PORT:-${MODELRIG_PORT:-8768}}:8768"
    volumes:
      - history:/data
    networks:
      - benchmark
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - LM_BENCHLAB_HOST=0.0.0.0
      - LM_BENCHLAB_PORT=8768
      - LM_BENCHLAB_NO_BROWSER=1
      - LM_BENCHLAB_DEFAULT_ENGINE_HOST=${LM_BENCHLAB_DEFAULT_ENGINE_HOST-${LLM_LAB_DEFAULT_ENGINE_HOST:-host.docker.internal}}
      - LM_BENCHLAB_MASTER_KEY=${LM_BENCHLAB_MASTER_KEY-${LLM_LAB_MASTER_KEY:-}}
volumes:
  history:
    # Keep the existing data volume across the project rename.
    name: llm-lab_history
networks:
  benchmark:
    # Existing inference containers may already be attached to this network.
    name: llm-lab-net
